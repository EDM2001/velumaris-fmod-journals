name: Release Module

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Update module.json
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          jq \
            --arg v "$VERSION" \
            --arg dl "https://github.com/EDM2001/velumaris-fmod-journals/releases/download/v${VERSION}/velumaris-fmod-journals.zip" \
            '.version = $v | .download = $dl' \
            module.json > module.json.tmp && mv module.json.tmp module.json

      - name: Create zip
        run: |
          zip -r velumaris-fmod-journals.zip . \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --exclude "*.zip" \
            --exclude "node_modules/*"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            module.json
            velumaris-fmod-journals.zip
